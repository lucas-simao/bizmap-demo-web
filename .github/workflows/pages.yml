name: BizMap map (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lucas-simao/bizmap-demo-api
          path: .bizmap/api
      # On push the Action skips the impact and only writes the graph page.
      - uses: lucas-simao/bizmap@612cc8f5ef313c5ee9de7d254b3ed91cf2949da7 # v0.17.0
        with:
          path: .bizmap
          html: _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
